<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Links oficiais e confiáveis da iniciativa Os Vingadores."
    />
    <meta name="theme-color" content="#0b0f19" />
    <meta name="robots" content="index, follow" />
    <title>Linktree - Os Vingadores</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230b0f19'/%3E%3Cpath d='M32 8 14 18v13c0 11.7 7.3 22.5 18 27 10.7-4.5 18-15.3 18-27V18L32 8zm-5 18h10v8H27v-8zm-2 10h14v4H25v-4zm1 8h12v4H26v-4z' fill='%23ef4444'/%3E%3C/svg%3E"
    />
    <style>
      :root {
        --bg-dark: #0b0f19;
        --bg-mid: #1f2937;
        --panel: rgba(15, 23, 42, 0.72);
        --panel-border: rgba(148, 163, 184, 0.25);
        --text: #f8fafc;
        --muted: #cbd5e1;
        --soft: #94a3b8;
        --red: #ef4444;
        --blue: #2563eb;
        --amber: #f59e0b;
        --slate: #475569;
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 1rem;
        font-family: Arial, Helvetica, sans-serif;
        background: radial-gradient(circle at top, #1f2937 0%, var(--bg-dark) 58%);
        color: var(--text);
      }

      .container {
        width: min(100%, 28rem);
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 1.5rem;
      }

      .avatar {
        width: 6rem;
        height: 6rem;
        border-radius: 999px;
        border: 4px solid var(--red);
        display: grid;
        place-items: center;
        background: rgba(15, 23, 42, 0.9);
        box-shadow: 0 12px 30px rgba(239, 68, 68, 0.28);
        letter-spacing: 0.08em;
        font-size: 2.3rem;
        font-weight: 900;
        color: transparent;
        background-image: linear-gradient(135deg, #ef4444 0%, #fbbf24 100%);
        -webkit-background-clip: text;
        background-clip: text;
      }

      .header {
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.75rem, 3vw, 2.2rem);
        line-height: 1.2;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .subtitle {
        margin: 0;
        color: var(--soft);
        font-size: 0.83rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .status {
        margin: 0;
        color: #86efac;
        font-size: 0.72rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .links {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 0.9rem;
      }

      .link {
        display: block;
        width: 100%;
        padding: 1rem 1.25rem;
        border-radius: 0.9rem;
        border: 1px solid var(--panel-border);
        background: rgba(30, 41, 59, 0.7);
        color: var(--text);
        text-decoration: none;
        font-weight: 800;
        font-size: 0.8rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease,
          background 0.2s ease;
      }

      .link:hover,
      .link:focus-visible {
        transform: translateY(-2px);
        outline: none;
      }

      .link.red:hover,
      .link.red:focus-visible {
        background: rgba(239, 68, 68, 0.92);
        border-color: rgba(239, 68, 68, 0.9);
        box-shadow: 0 16px 28px rgba(239, 68, 68, 0.2);
      }

      .link.blue:hover,
      .link.blue:focus-visible {
        background: rgba(37, 99, 235, 0.9);
        border-color: rgba(96, 165, 250, 0.9);
        box-shadow: 0 16px 28px rgba(37, 99, 235, 0.25);
      }

      .link.amber:hover,
      .link.amber:focus-visible {
        background: rgba(245, 158, 11, 0.95);
        border-color: rgba(251, 191, 36, 0.9);
        color: #111827;
        box-shadow: 0 16px 28px rgba(245, 158, 11, 0.28);
      }

      .link.slate:hover,
      .link.slate:focus-visible {
        background: rgba(71, 85, 105, 0.95);
        border-color: rgba(148, 163, 184, 0.9);
      }

      .socials {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 1rem;
        padding-top: 0.75rem;
      }

      .socials a {
        color: var(--muted);
        text-decoration: none;
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .socials a:hover,
      .socials a:focus-visible {
        color: #fca5a5;
        outline: none;
      }

      footer {
        padding-top: 1rem;
        color: var(--soft);
        font-size: 0.74rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      @media (max-width: 420px) {
        body {
          padding: 1.5rem 0.875rem;
        }

        .link {
          letter-spacing: 0.05em;
        }
      }
    </style>
  </head>
  <body>
    <main class="container" aria-label="Página de links oficiais">
      <div class="avatar" aria-label="Logo principal">A</div>

      <header class="header">
        <h1>Os Vingadores</h1>
        <p class="subtitle">Iniciativa Vingadores • Links Oficiais</p>
        <p class="status">Conexão segura • acesso confiável</p>
      </header>

      <nav class="links" aria-label="Links principais">
        <a
          class="link red"
          href="https://www.marvel.com"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Abrir site oficial da Marvel em nova aba"
        >
          🛡️ Site Oficial da Marvel
        </a>

        <a
          class="link blue"
          href="https://www.disneyplus.com/pt-br"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Abrir Disney Plus em nova aba"
        >
          🎬 Assistir no Disney+
        </a>

        <a
          class="link amber"
          href="https://www.shopdisney.com/"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Abrir loja oficial de produtos em nova aba"
        >
          🛒 Loja Oficial de HQs e Action Figures
        </a>

        <a
          class="link slate"
          href="https://www.playstation.com/pt-br/games/"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Abrir catálogo de jogos em nova aba"
        >
          🎮 Jogos Disponíveis
        </a>
      </nav>

      <div class="socials" aria-label="Redes sociais oficiais">
        <a href="https://www.instagram.com/marvel/" target="_blank" rel="noopener noreferrer">Instagram</a>
        <a href="https://www.youtube.com/@Marvel" target="_blank" rel="noopener noreferrer">YouTube</a>
        <a href="https://x.com/Marvel" target="_blank" rel="noopener noreferrer">X / Twitter</a>
      </div>

      <footer>Feito para ser confiável e acessível</footer>
    </main>
  </body>
</html>
